name: Deploy to GitHub Pages

# main に push するたびに GitHub Pages へ公開する。
# ビルド工程はないので、リポジトリの中身をそのままアップロードするだけ。
# 使う前に、リポジトリの Settings → Pages → Source を
# 「GitHub Actions」にしておくこと。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
