<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>リバーシ</title>
    <meta name="description" content="AIと対戦できるリバーシ（オセロ）。段位は入門から十段まで。" />
    <meta name="theme-color" content="#0f2a1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="リバーシ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button id="updateBanner" class="update-banner" type="button" hidden>
      更新があります（タップで再読み込み）
    </button>

    <div class="app">
      <!-- ================= トップ画面 ================= -->
      <section class="home" id="homeScreen">
        <div class="home-sticky">
          <h1>リバーシ</h1>
          <div class="color-choice" id="colorChoice">
            <button type="button" class="color-btn" data-color="1" aria-pressed="true">
              <span class="stone stone-black" aria-hidden="true"></span>
              <span>黒（先手）</span>
            </button>
            <button type="button" class="color-btn" data-color="-1" aria-pressed="false">
              <span class="stone stone-white" aria-hidden="true"></span>
              <span>白（後手）</span>
            </button>
          </div>
          <button type="button" class="start-btn" id="btnStart">対局開始</button>
        </div>

        <button type="button" class="resume-btn" id="btnResume" hidden>対局中の盤面にもどる</button>

        <div class="home-block">
          <div class="home-block-head">
            <h2>段位をえらぶ</h2>
            <span class="home-note">上の段ほど深く読み、ミスが減ります</span>
          </div>
          <ul class="level-list" id="levelList"></ul>
        </div>

        <div class="home-block">
          <div class="home-block-head">
            <h2>勝敗記録</h2>
            <span class="home-note">この端末に保存されます</span>
          </div>
          <div class="home-records" id="homeRecords"></div>
        </div>

        <p class="app-version" id="appVersion"></p>
      </section>

      <!-- ================= 対局画面 ================= -->
      <section class="game" id="gameScreen" hidden>
        <header class="app-header">
          <button type="button" class="home-link" id="btnHome" aria-label="トップ画面にもどる">
            ← トップ
          </button>
          <div class="header-meta">
            <span class="badge" id="levelBadge">初段</span>
            <span class="badge" id="colorBadge">あなた：黒</span>
          </div>
        </header>

        <section class="scoreboard" aria-live="polite">
          <div class="score" id="scoreBlack">
            <span class="stone stone-black" aria-hidden="true"></span>
            <span class="score-count" id="countBlack">2</span>
            <span class="score-label" id="labelBlack">あなた</span>
          </div>
          <div class="turn" id="turnText">黒番</div>
          <div class="score" id="scoreWhite">
            <span class="stone stone-white" aria-hidden="true"></span>
            <span class="score-count" id="countWhite">2</span>
            <span class="score-label" id="labelWhite">AI</span>
          </div>
        </section>

        <div class="board-outer" id="boardOuter">
          <div class="axis axis-x" id="axisX" aria-hidden="true"></div>
          <div class="axis axis-y" id="axisY" aria-hidden="true"></div>
          <div class="board" id="board" role="grid" aria-label="リバーシの盤面"></div>
        </div>

        <p class="message" id="message">黒番です。石を置いてください。</p>

        <nav class="controls">
          <button type="button" id="btnUndo" class="btn">
            <span class="btn-icon">◀</span><span>戻る</span>
          </button>
          <button type="button" id="btnRedo" class="btn">
            <span class="btn-icon">▶</span><span>進む</span>
          </button>
          <button type="button" id="btnAssist" class="btn btn-toggle btn-accent" aria-pressed="false">
            <span class="btn-icon">✦</span><span>アシスト</span>
          </button>
          <button type="button" id="btnExplain" class="btn btn-toggle btn-accent" aria-pressed="false">
            <span class="btn-icon">？</span><span>解説</span>
          </button>
          <button type="button" id="btnCoords" class="btn btn-toggle" aria-pressed="false">
            <span class="btn-icon">＃</span><span>盤面</span>
          </button>
          <button type="button" id="btnHints" class="btn btn-toggle" aria-pressed="true">
            <span class="btn-icon">●</span><span>ヒント</span>
          </button>
          <button type="button" id="btnNew" class="btn">
            <span class="btn-icon">↻</span><span>やり直す</span>
          </button>
          <button type="button" id="btnRecords" class="btn">
            <span class="btn-icon">▤</span><span>記録</span>
          </button>
        </nav>

        <section class="panel" id="explainPanel" hidden>
          <div class="panel-head">
            <h2>解説</h2>
            <button type="button" class="panel-close" data-close="explainPanel" aria-label="閉じる">×</button>
          </div>
          <div class="panel-body" id="explainBody"></div>
        </section>

        <section class="panel" id="recordsPanel" hidden>
          <div class="panel-head">
            <h2>勝敗記録</h2>
            <button type="button" class="panel-close" data-close="recordsPanel" aria-label="閉じる">×</button>
          </div>
          <div class="panel-body" id="recordsBody"></div>
        </section>

        <section class="panel panel-flat" id="movesPanel">
          <div class="panel-head">
            <h2>棋譜</h2>
            <span class="panel-note">タップでその局面へ</span>
          </div>
          <div class="panel-body">
            <ol class="movelist" id="moveList"></ol>
          </div>
        </section>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="overlay" id="resultOverlay" hidden>
      <div class="result-card">
        <h2 id="resultTitle">対局終了</h2>
        <p class="result-score" id="resultScore"></p>
        <p class="result-detail" id="resultDetail"></p>
        <p class="result-record" id="resultRecord"></p>
        <div class="result-actions">
          <button type="button" class="btn btn-accent" id="btnResultNew">もう一局</button>
          <button type="button" class="btn" id="btnResultReview">局面を見直す</button>
          <button type="button" class="btn result-wide" id="btnResultHome">トップ画面へ</button>
        </div>
      </div>
    </div>

    <script src="js/version.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
